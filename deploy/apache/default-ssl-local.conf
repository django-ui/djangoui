<VirtualHost *:80>
    ServerName  sada.us.lmco.com
    ServerAlias sada.us.lmco.com
    #Redirect / https://sada.us.lmco.com

    #ProxyPass        / http://localhost/
    #ProxyPassReverse / http://localhost/

    ## Uncomment to redirect everything to https - that makes sense 
    ## unless you are testing something
    ##
    Redirect permanent / https://%{HTTP_HOST}/
</VirtualHost>

<IfModule mod_ssl.c>

<VirtualHost *:443>
    ServerName sada.us.lmco.com
    ServerAlias sada.us.lmco.com
    SSLEngine on
    #ProxyRequests Off
    <Proxy *>
        #Order deny,allow
        #Allow from all
    </Proxy>

    ProxyPass        / http://localhost:8000/
    ProxyPassReverse / http://localhost:8000/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        /static http://localhost:8000/static
    ProxyPassReverse /static http://localhost:8000/static

    <Location />
        Order allow,deny
        Allow from all
    </Location>
    ServerAlias sada.us.lmco.com
    SSLCertificateFile /etc/ssl/certs/sada.us.lmco.com.crt 
    SSLCertificateKeyFile /etc/ssl/certs/sada.us.lmco.com.key
    
    # Logging
    ErrorLog  ${APACHE_LOG_DIR}/sada-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/sada-ssl-access.log combined
</VirtualHost>


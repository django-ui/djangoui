{% if impersonating_as %}
<div id="impersonationBadge"
     style="position:fixed;right:18px;bottom:18px;z-index:9999;
            background:#fff8e1;border:1px solid #f5c518;border-radius:12px;
            box-shadow:0 8px 24px rgba(0,0,0,0.18);color:#1d1d1f;
            padding:10px 14px;font-size:13px;
            font-family:-apple-system,BlinkMacSystemFont,sans-serif;
            display:flex;align-items:center;gap:10px;max-width:340px;">
    <i class="fas fa-user-secret" style="color:#7a5c00;font-size:16px;"></i>
    <div style="line-height:1.3;">
        <div>Impersonating <strong>{{ impersonating_as }}</strong></div>
        {% if snapshot.username %}
        <div style="color:#6e6e73;font-size:11.5px;">as {{ snapshot.username }}</div>
        {% endif %}
    </div>
    <form method="post" action="{% url 'impersonate:stop' %}" style="margin:0;">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}">
        <button type="submit"
                title="Exit impersonation"
                style="background:#1d1d1f;color:#fff;border:0;border-radius:8px;
                       padding:5px 11px;cursor:pointer;font-size:12px;font-weight:500;">
            Exit
        </button>
    </form>
</div>
{% endif %}

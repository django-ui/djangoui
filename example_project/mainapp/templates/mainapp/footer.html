<style>
/* Sticky footer: push to bottom when page is shorter than viewport,
   sit naturally after content otherwise. */
.pagecontent {
    display: flex;
    flex-direction: column;
    min-height: calc(100vh - 70px); /* subtract approx navbar height */
}
.af-footer {
    margin-top: auto; /* expands gap above footer when page is short */
    border-top: 1px solid #d2d2d7;
    background: #f5f5f7;
    padding: 40px 20px 24px;
}
html[data-theme="dark"] .af-footer {
    background: #111827;
    border-top-color: #374151;
}
.af-footer-inner {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 32px 24px;
}
.af-footer-col h6 {
    font-size: 11px;
    font-weight: 600;
    color: #1d1d1f;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 12px;
}
html[data-theme="dark"] .af-footer-col h6 { color: #e5e7eb; }
.af-footer-col ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.af-footer-col ul li a {
    font-size: 13px;
    color: #6e6e73;
    text-decoration: none;
    transition: color 0.15s;
}
html[data-theme="dark"] .af-footer-col ul li a { color: #9ca3af; }
.af-footer-col ul li a:hover { color: #0071e3; }
html[data-theme="dark"] .af-footer-col ul li a:hover { color: #60a5fa; }
.af-footer-bottom {
    max-width: 900px;
    margin: 28px auto 0;
    padding-top: 16px;
    border-top: 1px solid #d2d2d7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
}
html[data-theme="dark"] .af-footer-bottom { border-top-color: #374151; }
.af-footer-bottom span {
    font-size: 12px;
    color: #6e6e73;
}
html[data-theme="dark"] .af-footer-bottom span { color: #9ca3af; }
</style>

        <div class="af-footer-col">

            <ul>

            </ul>
        </div>
        <div class="af-footer-col">

    </div>

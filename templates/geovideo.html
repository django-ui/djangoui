<style>
.geovideo{
  position: fixed;
  bottom: 0;
  right: 0;
  width: 84;
  height: 64;
  border-radius: 6px;
  border: 2px solid gray;
  z-index: 3;
  background-color: #ddd;
  font-size: medium;
}
.geovide_canvas{
  border:2px solid firebrick
}
.rbuttsm1 {
  font-size: x-small;
  font-weight: 100;
}
</style>
<div id="geovideo" class="geovideo draggable resizable" 
    onMouseOver="$('#geovideotoolbar').show()"
    onMouseleave="$('#geovideotoolbar').hide()"
  >
  <div id="geovideotoolbar" style="z-index: 4;;position:absolute; top: 0; height:20px; width:100%; display: none;">

    <button class="rbutt16 rbuttsm" 
        onclick="toggleCamera();$(this).blur()"><i class="fa fa-video" ></i>
    </button>
    <button class="rbutt16 rbuttsm" X
        onclick="expandVideoControl()"><i class="fa fa-expand-alt" ></i>
    </button>
    <button id="cc" class="rbutt16 rbuttsm" 
        onclick="whatisit();$(this).blur()"><i class="fa fa-question" ></i>
    </button>
    <button class="rbutt16 rbuttsm" 
        onclick="whoisit();$(this).blur()"><i class="fa fa-user " ></i>
    </button>
    <button id="cc" class="rbutt16 rbuttsm" 
        onclick="$(this).parent().parent().slideToggle(); $(this).blur()"><i class="fa fa-close" ></i>
    </button>
  </div>


  <video  id="video" width='100%' height="100%" autoplay playsinline 
      style="padding:0; " 
      >
    </video>
</div>
<canvas id="canvas" style="display: none"></canvas>
<br />
<!--
<button class="btn btn-sm-primary" onclick="startCamera()">Start Camera</button>
<button class="btn btn-sm-primary" onclick="stopCamera()">Stop Camera</button>
<button class="btn btn-sm-primary" onclick="capturePhoto()">Capture Photo</button>
-->
<script>
let _video_stream = null;
const videoElement = document.getElementById('video');
const video_context = canvas.getContext('2d');
</script>

<script>

function expandVideoControl() {
  console.log("Changing video size")
  if ($('#geovideo').width() < 80 ) {
    $('#geovideo').width(80)
    $('#geovideo').height(60)
  }
  else if ($('#geovideo').width() < 160 ) {
    $('#geovideo').width(160)
    $('#geovideo').height(120)
  }
  else if ($('#geovideo').width() < 320 ) {
    $('#geovideo').width(320)
    $('#geovideo').height(240)
  }
  else if ($('#geovideo').width() < 640 ) {
    $('#geovideo').width(640)
    $('#geovideo').height(480)
  } else {
    $('#geovideo').width(80)
    $('#geovideo').height(60)
  }

}  
async function startCamera() {
  try {
    _video_stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    videoElement.srcObject = _video_stream;
  } catch (err) {
    console.error('Error accessing camera:', err);
    alert('Could not access camera. Please check permissions.');
  }
}

function stopCamera() {
  if (_video_stream) {
    _video_stream.getTracks().forEach(track => track.stop());
    videoElement.srcObject = null;
    _video_stream = null;
  }
}

function toggleCamera() {
  if (!_video_stream) {
    startCamera()
    return;
  } else {
    stopCamera()
  }
}

function capturePhoto() {
  if (!_video_stream) {
    startCamera()
    return null;
  }
  // Set canvas size to match video size
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  // Draw current frame to canvas
  video_context.drawImage(video, 0, 0, canvas.width, canvas.height);
}


function downloadPhoto() {
  if (!_video_stream) {
    console.log("Camera not started!")
    return null;
  }
  const imageData = canvas.toDataURL("image/png");
  const link = document.createElement("a");
  link.href = imageData;
  link.download = "captured-photo.png";
  link.click();
}

function whatDoYouSee() {
  if (!_video_stream) {
    console.log("Camera not started! I dont see anything")
    return null;
  }
  const imageData = canvas.toDataURL("image/png");
  data ={ image: imageData }
  callws("/geoutils/geovideo", "", whatDoYouSeeCB, data)
}
function whoDoYouSee() {
  if (!_video_stream) {
    console.log("Camera not started! I dont see anyone")
    return null;
  }
  const imageData = canvas.toDataURL("image/png");
  data ={ image: imageData }
  callws("/geoutils/whoyousee", "", whoDoYouSeeCB, data)
}
</script>

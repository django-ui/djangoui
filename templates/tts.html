<script>
/*
Make sure you start Kokoro service:

docker run -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-cpu:latest 

*/

const kokoro_voices = ['af_bella', 'af_echo', 'af_sky', 'af_heart', 'am_michael', 'am_eric']; 

function startSpeakingAnimate(text){
}    
function stopSpeakingAnimate(text){
}    
async function tts(text, callback = null, voice="af_bella", 
                    url='http://localhost:8880/v1/audio/speech',
                    ) {
    try {
        startSpeakingAnimate();
        
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: 'kokoro',
                input: text,
                voice: voice,
                response_format: 'mp3',
                speed: 1.0
            })
        });
        
        if (response.ok) {
            const audioBlob = await response.blob();
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            
            audio.onended = () => {
                stopSpeakingAnimate()
                URL.revokeObjectURL(audioUrl);
            };
            audio.onerror = () => { stopSpeakingAnimate() };
            await audio.play();
            if ( callback ) {
                callback()
            }

        } else {
            throw new Error('TTS service unavailable');
        }
    } catch (error) {
        console.error('TTS Error:', error);
        stopSpeakingAnimate();
    }
}
</script>
